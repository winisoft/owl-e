#Kotlin
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx4096M

#Gradle
org.gradle.jvmargs=-Xmx4096M -Dfile.encoding=UTF-8

#Ktor
io.ktor.development=true

mockk.classloading.override=true

# KSP
# The DbMapper generator derives every mapper from the whole entity+DTO set (it runs a closure
# pass to decide what is emittable), but an incremental round only hands `Resolver.getAllFiles()`
# the *dirty* files. Any edit outside the entity layer therefore produced an empty view and
# deleted all 73 generated mappers. `aggregating = true` on the outputs is not enough.
ksp.incremental=false

# `ksp(...)` defaults to applying processors to *every* compilation, so the mapper generator also
# ran over the test source set, where it sees test fakes instead of the entity layer. Restrict
# `ksp(...)` to main; test-only processors would be declared with `kspTest(...)`.
ksp.allow.all.target.configuration=false
