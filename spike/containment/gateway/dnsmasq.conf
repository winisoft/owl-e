# Answer EVERY name with the gateway's own address.
# This is what makes interception require no cooperation from the workload:
# api.stripe.com, evil.example, pypi.org — all of them resolve to us.
address=/#/172.28.0.10

# Never consult an upstream resolver. There isn't one; the network is sealed.
no-resolv

# Useful while debugging the spike.
log-queries
log-facility=-

bind-interfaces
